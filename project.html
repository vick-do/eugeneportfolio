<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Eugene Gyasi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">

  <style>
    .back {
      display: inline-flex; align-items: center; gap: 10px;
      color: var(--cream-muted); margin-bottom: 36px;
      transition: color .2s ease, gap .2s ease;
    }
    .back:hover { color: var(--cream); gap: 14px; }

    .page-head h1 { max-width: 16ch; }

    /* Meta row */
    .meta {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 24px; margin-top: 64px; padding-top: 24px;
      border-top: 1px solid var(--cream-faint);
    }
    .meta .label { display: block; margin-bottom: 12px; }
    .meta p { margin: 0; font-size: 16px; line-height: 1.6; }

    /* Images */
    .hero-img {
      width: 100%; aspect-ratio: 16 / 8; object-fit: cover;
      background: #e3ddd4;
    }
    .gallery {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .gallery img { width: 100%; object-fit: cover; border-radius: 3px; background: #e3ddd4; }
    .gallery .tall { aspect-ratio: 4 / 5; }
    .gallery .full { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
    .gallery .square { aspect-ratio: 1; }

    /* Text blocks */
    .text p {
      font: 400 clamp(20px, 1.9vw, 30px)/1.45 var(--sans);
      letter-spacing: -.015em; margin: 0; max-width: 34ch;
    }

    /* Palette */
    .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .swatch {
      aspect-ratio: 3 / 4; border-radius: 3px;
      display: flex; align-items: flex-end; padding: 14px;
      border: 1px solid rgba(0,0,0,.06);
      transition: transform .3s ease;
    }
    .swatch:hover { transform: translateY(-6px); }

    /* Results */
    .results {
      display: grid; grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    }
    .result { padding: 36px 24px 36px 0; border-right: 1px solid var(--line); }
    .result + .result { padding-left: 24px; }
    .result:last-child { border-right: 0; }
    .result strong {
      display: block; font: 400 clamp(44px, 4.5vw, 80px)/1 var(--sans);
      letter-spacing: -.05em; color: var(--wine); margin-bottom: 14px;
    }

    /* Quote */
    blockquote { margin: 0; }
    blockquote p {
      font: italic 500 clamp(26px, 3vw, 48px)/1.25 var(--serif);
      letter-spacing: -.01em; margin: 0 0 24px; max-width: 26ch;
    }

    /* Next project */
    .next {
      position: relative; display: block; overflow: hidden;
      background: var(--bar); color: var(--cream);
      min-height: 60vh;
    }
    .next img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: .45; filter: grayscale(100%);
      transition: transform 1.2s cubic-bezier(.2,.7,.2,1), opacity .4s ease;
    }
    .next:hover img { transform: scale(1.05); opacity: .6; }
    .next .inner {
      position: relative; z-index: 2;
      min-height: 60vh; display: flex; flex-direction: column; justify-content: center;
      padding: 80px var(--gutter);
    }
    .next .label { color: var(--cream-muted); }
    .next h2 {
      font: 400 clamp(48px, 7vw, 120px)/1 var(--sans);
      letter-spacing: -.045em; margin: 18px 0 30px;
    }

    /* Not found */
    .not-found { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 24px; background: var(--wine); color: var(--cream); padding: 24px; }
    .not-found h1 { font: 400 clamp(40px, 5vw, 80px)/1 var(--sans); letter-spacing: -.04em; margin: 0; }

    @media (max-width: 900px) {
      .meta { grid-template-columns: 1fr 1fr; }
      .palette { grid-template-columns: repeat(5, minmax(56px, 1fr)); }
      .swatch .label { display: none; }
      .results { grid-template-columns: 1fr; }
      .result, .result + .result { padding: 28px 0; border-right: 0; border-bottom: 1px solid var(--line); }
      .result:last-child { border-bottom: 0; }
    }
    @media (max-width: 560px) {
      .gallery { grid-template-columns: 1fr; }
      .hero-img { aspect-ratio: 4 / 3; }
    }
  </style>
</head>

<body>

  <!-- ================= NAV ================= -->
  <nav class="nav" aria-label="Main navigation">
    <a href="contact.html" class="contact-link" aria-label="Contact" title="Contact">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 7l9 6 9-6"/></svg>
    </a>
    <a href="index.html" class="logo" aria-label="Home">E</a>
    <button id="menuButton" aria-label="Open menu" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 10h12M6 14h12"/></svg>
    </button>
    <div class="menu label" id="menu">
      <a href="work.html" aria-current="page">The Work</a>
      <a href="process.html">The Process</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <!-- The page content is filled in from projects.js -->
  <div id="app"></div>

  <!-- ================= FOOTER ================= -->
  <div class="curtain" aria-hidden="true"></div>
  <footer class="footer">
    <div class="label">( Your Story Next )</div>
    <h2>Like what you see?<br>Let’s make yours.</h2>
    <a href="contact.html" class="btn">Start a Project <span class="box">→</span></a>
    <div class="footer-row label">
      <nav>
        <a href="work.html">The Work</a>
        <a href="process.html">The Process</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <span>© <span data-year></span> Eugene Gyasi</span>
    </div>
  </footer>

  <script src="projects.js"></script>
  <script>
    const app = document.getElementById('app');
    const slug = new URLSearchParams(location.search).get('p');
    const index = PROJECTS.findIndex(p => p.slug === slug);

    // Escape text so project data can't break the page
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    if (index === -1) {
      document.title = 'Project not found — Eugene Gyasi';
      app.innerHTML = `
        <section class="not-found">
          <div class="label" style="color:var(--cream-muted)">( Intermission )</div>
          <h1>This project isn’t on stage.</h1>
          <div><a class="btn" href="work.html">Back to all work <span class="box">←</span></a></div>
        </section>`;
    } else {
      const p = PROJECTS[index];
      const next = PROJECTS[(index + 1) % PROJECTS.length];
      const no = String(index + 1).padStart(2, '0');
      const g = p.gallery;
      document.title = `${p.name} — Eugene Gyasi`;

      app.innerHTML = `
        <header class="page-head">
          <a href="work.html" class="back label">← All work</a>
          <div class="label">( No. ${no} — ${esc(p.category)} )</div>
          <h1>${esc(p.name)}</h1>
          <p class="lead">${esc(p.summary)}</p>
          <div class="meta">
            <div><span class="label">Client</span><p>${esc(p.client)}</p></div>
            <div><span class="label">Services</span><p>${p.services.map(esc).join('<br>')}</p></div>
            <div><span class="label">Year · Duration</span><p>${esc(p.year)} · ${esc(p.duration)}</p></div>
            <div><span class="label">Location</span><p>${esc(p.location)}</p></div>
          </div>
        </header>

        <img class="hero-img" src="${p.hero}" alt="${esc(p.name)} — main image">

        <main>
          <section class="section wrap split text">
            <div class="label">( The Brief )</div>
            <div class="reveal"><p>${esc(p.brief)}</p></div>
          </section>

          <section class="wrap">
            <div class="gallery">
              <img class="tall reveal" src="${g[0]}" alt="${esc(p.name)} image 1">
              <img class="tall reveal" src="${g[1]}" alt="${esc(p.name)} image 2">
              <img class="full reveal" src="${g[2]}" alt="${esc(p.name)} image 3">
            </div>
          </section>

          <section class="section wrap split text">
            <div class="label">( The Idea )</div>
            <div class="reveal"><p>${esc(p.idea)}</p></div>
          </section>

          <section class="wrap split" style="padding-bottom:clamp(64px,9vw,140px)">
            <div class="label">( The Palette )</div>
            <div class="palette">
              ${p.palette.map(c => {
                const light = parseInt(c.slice(1, 3), 16) * .299 + parseInt(c.slice(3, 5), 16) * .587 + parseInt(c.slice(5, 7), 16) * .114 > 150;
                return `<div class="swatch reveal" style="background:${esc(c)};color:${light ? '#161412' : '#f4e7dc'}"><span class="label">${esc(c)}</span></div>`;
              }).join('')}
            </div>
          </section>

          <section class="wrap">
            <div class="gallery">
              <img class="square reveal" src="${g[3]}" alt="${esc(p.name)} image 4">
              <img class="square reveal" src="${g[4]}" alt="${esc(p.name)} image 5">
            </div>
          </section>

          <section class="section wrap split">
            <div class="label">( The Outcome )</div>
            <div>
              <div class="results">
                ${p.results.map(([n, t]) => `<div class="result reveal"><strong>${esc(n)}</strong><span class="label muted">${esc(t)}</span></div>`).join('')}
              </div>
              <blockquote class="reveal" style="margin-top:clamp(56px,7vw,100px)">
                <p>“${esc(p.quote.text)}”</p>
                <footer class="label muted">— ${esc(p.quote.by)}</footer>
              </blockquote>
            </div>
          </section>

          <a class="next" href="project.html?p=${next.slug}">
            <img src="${next.hero}" alt="">
            <div class="inner">
              <div class="label">( Next Project )</div>
              <h2>${esc(next.name)}</h2>
              <span class="btn" style="width:fit-content">View Project <span class="box">→</span></span>
            </div>
          </a>
        </main>`;
    }
  </script>
  <!-- site.js runs after the content is built so menus, reveals and image fallbacks work -->
  <script src="site.js"></script>
</body>
</html>
